name: Refresh placement tracker

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: placement-tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new UK placements
        run: python update_jobs.py

      - name: Save refreshed opportunities
        run: |
          git config user.name "placement-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No changes found"
          else
            git commit -m "Refresh UK placement opportunities"
            git push
          fi
